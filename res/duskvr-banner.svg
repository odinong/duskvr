<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="DuskVR">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1035"/>
      <stop offset="0.45" stop-color="#5a2a5e"/>
      <stop offset="0.75" stop-color="#d0643b"/>
      <stop offset="1" stop-color="#f3b45a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6a8"/>
      <stop offset="0.6" stop-color="#ffc062"/>
      <stop offset="1" stop-color="#ffc062" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1a45"/>
      <stop offset="1" stop-color="#120a22"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#sky)"/>
  <circle cx="980" cy="300" r="170" fill="url(#sun)"/>
  <!-- distant ridges -->
  <path d="M0 300 L120 250 L230 285 L360 220 L470 270 L600 230 L720 280 L860 240 L1000 285 L1130 245 L1280 280 L1280 400 L0 400 Z" fill="#3a1f3f" opacity="0.85"/>
  <path d="M0 340 L150 300 L300 330 L420 295 L560 335 L700 305 L860 340 L1010 310 L1160 345 L1280 320 L1280 400 L0 400 Z" fill="#1d1028"/>
  <!-- headset -->
  <g transform="translate(150 95)">
    <rect x="0" y="40" width="300" height="140" rx="56" fill="#e9e1f2"/>
    <rect x="18" y="58" width="264" height="104" rx="44" fill="url(#lens)"/>
    <circle cx="92" cy="110" r="34" fill="#3d2763"/>
    <circle cx="208" cy="110" r="34" fill="#3d2763"/>
    <circle cx="92" cy="110" r="34" fill="none" stroke="#f3b45a" stroke-width="4" opacity="0.8"/>
    <circle cx="208" cy="110" r="34" fill="none" stroke="#f3b45a" stroke-width="4" opacity="0.8"/>
    <path d="M130 162 Q150 140 170 162" fill="#e9e1f2"/>
    <rect x="-38" y="92" width="44" height="20" rx="10" fill="#e9e1f2"/>
    <rect x="294" y="92" width="44" height="20" rx="10" fill="#e9e1f2"/>
  </g>
  <text x="530" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="128" font-weight="800" fill="#fff4e3" letter-spacing="2">Dusk<tspan fill="#f3b45a">VR</tspan></text>
  <text x="536" y="268" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#f6dcc4" opacity="0.92">Full-body 6DoF VR for Dusklight</text>
</svg>
